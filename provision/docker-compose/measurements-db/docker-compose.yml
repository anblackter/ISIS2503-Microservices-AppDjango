services:
  measurements-db:
    image: postgres:17.3-alpine
    container_name: measurements-db
    restart: always
    environment:
      POSTGRES_USER: measurements_user
      POSTGRES_PASSWORD: isis2503
      POSTGRES_DB: measurements_db
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 3