services:
  variables-db:
    image: postgres:17.3-alpine
    container_name: variables-db
    restart: always
    environment:
      POSTGRES_USER: variables_user
      POSTGRES_PASSWORD: isis2503
      POSTGRES_DB: variables_db
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 3